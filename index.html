<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="theme-color" content="#F5C842" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trading Suite" />
    <title>Trading Suite</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="root">
        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="app-logo"><i class="bi bi-graph-up-arrow"></i></div>
                <div>
                    <div class="app-name">Trading Suite</div>
                    <div class="topbar-sub" id="topbarSub">Memuat...</div>
                </div>
            </div>
            <div class="topbar-right">
                <div class="rate-pill" id="ratePill" onclick="Calculator.fetchRate()">
                    <span class="rate-dot"></span>
                    <span id="ratePillText">Memuat...</span>
                </div>
                <button class="icon-btn" id="btnAccPicker" onclick="App.openAccountPicker()">
                    <i class="bi bi-layers"></i>
                </button>
                <button class="icon-btn" onclick="Trades.openAddModal()">
                    <i class="bi bi-plus-lg"></i>
                </button>
            </div>
        </header>

        <!-- PAGES -->
        <main class="page-area" id="pageArea">
            <div id="page-dashboard"></div>
            <div id="page-calculator" class="d-none"></div>
            <div id="page-trades" class="d-none"></div>
            <div id="page-settings" class="d-none"></div>
        </main>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-dashboard" onclick="App.go('dashboard')">
                <div class="nav-icon-wrap"><i class="bi bi-grid-1x2-fill"></i></div><span>Dashboard</span>
            </button>
            <button class="nav-item" id="nav-calculator" onclick="App.go('calculator')">
                <div class="nav-icon-wrap"><i class="bi bi-calculator-fill"></i></div><span>Kalkulator</span>
            </button>
            <button class="nav-fab-wrap" onclick="Trades.openAddModal()">
                <div class="nav-fab"><i class="bi bi-plus-lg"></i></div>
            </button>
            <button class="nav-item" id="nav-trades" onclick="App.go('trades')">
                <div class="nav-icon-wrap"><i class="bi bi-journal-bookmark-fill"></i></div><span>Trading</span>
            </button>
            <button class="nav-item" id="nav-settings" onclick="App.go('settings')">
                <div class="nav-icon-wrap"><i class="bi bi-sliders"></i></div><span>Pengaturan</span>
            </button>
        </nav>
    </div>

    <!-- ── BOTTOM SHEETS ── -->
    <div class="bottom-sheet" id="accPickerSheet">
        <div class="bottom-sheet-content">
            <div class="sheet-handle"></div>
            <div class="sheet-title"><i class="bi bi-layers me-2"></i>Pilih Akun</div>
            <div id="accPickerList"></div>
            <button class="ghost-btn w-100 mt-3" onclick="Settings.openAddAccount()"><i
                    class="bi bi-plus-lg me-2"></i>Tambah Akun Baru</button>
            <button class="ghost-btn w-100 mt-2" onclick="App.closeSheet('accPickerSheet')">Tutup</button>
        </div>
    </div>

    <div class="bottom-sheet" id="tradeSheet">
        <div class="bottom-sheet-content">
            <div class="sheet-handle"></div>
            <div class="sheet-title" id="tradeSheetTitle"><i class="bi bi-journal-plus me-2"></i>Tambah Trade</div>
            <form id="tradeForm" class="sheet-form">
                <input type="hidden" id="tradeId" />
                <div class="form-row-2">
                    <div class="field-group"><label>Tanggal</label><input type="date" id="tradeDate" class="field" />
                    </div>
                    <div class="field-group"><label>Akun</label><select id="tradeAccount" class="field"></select></div>
                </div>
                <div class="form-row-2">
                    <div class="field-group"><label>Metode</label><select id="tradeEntry" class="field">
                            <option value="">-- Pilih --</option>
                        </select></div>
                    <div class="field-group"><label>Profit / Loss</label>
                        <div class="input-icon-wrap"><input type="number" id="tradePL" class="field" placeholder="+/-"
                                step="0.01" /><span class="input-suffix" id="plSuffix">IDR</span></div>
                    </div>
                </div>
                <div id="tradePreview" class="trade-preview">Masukkan nilai P/L</div>
                <div class="field-group"><label>Catatan Psikologi</label><textarea id="tradePsych" class="field"
                        rows="3" placeholder="Emosi, alasan, pelajaran..."></textarea></div>
            </form>
            <button class="gold-btn w-100 mt-3" id="saveTradeBtn"><i class="bi bi-check-lg me-2"></i>Simpan
                Trade</button>
            <button class="ghost-btn w-100 mt-2" onclick="App.closeSheet('tradeSheet')">Batal</button>
        </div>
    </div>

    <div class="bottom-sheet" id="accountSheet">
        <div class="bottom-sheet-content">
            <div class="sheet-handle"></div>
            <div class="sheet-title" id="accSheetTitle"><i class="bi bi-person-plus me-2"></i>Tambah Akun</div>
            <form id="accountForm" class="sheet-form">
                <input type="hidden" id="accountId" />
                <input type="hidden" id="accountIcon" value="bi-wallet2" />
                <div class="field-group"><label>Nama Akun</label><input type="text" id="accountName" class="field"
                        placeholder="e.g. Standard" /></div>
                <div class="icon-selector">
                    <label>Ikon Akun</label>
                    <div class="icon-preview-row">
                        <div class="icon-preview-box" id="accIconPreviewBox"><i class="bi bi-wallet2"></i></div>
                        <div class="flex-grow"><input type="file" class="field" id="accountIconFile" accept="image/*"
                                onchange="Settings.handleIconUpload(event)" />
                            <div class="hint">Upload foto atau pilih preset</div>
                        </div>
                    </div>
                    <div class="icon-presets" id="iconPresets"></div>
                </div>
                <div class="form-row-2">
                    <div class="field-group"><label>Mata Uang</label><select id="accountCurrency" class="field">
                            <option value="IDR">IDR</option>
                            <option value="Cent">Cent</option>
                        </select></div>
                    <div class="field-group"><label>Status</label><select id="accountStatus" class="field">
                            <option value="Active">Aktif</option>
                            <option value="Inactive">Nonaktif</option>
                        </select></div>
                </div>
                <div class="form-row-2">
                    <div class="field-group"><label>Target Harian (%)</label><input type="number" id="accountTargetPct"
                            class="field" placeholder="0" step="0.01" /></div>
                    <div class="field-group"><label>Target Harian (Angka)</label><input type="number" id="accountTarget"
                            class="field" placeholder="0" /></div>
                </div>
                <div class="form-row-2">
                    <div class="field-group"><label>Batas Loss Harian</label><input type="number" id="accountLossLimit"
                            class="field" placeholder="0" /></div>
                    <div class="field-group"><label>Saldo Awal</label><input type="number" id="accountBalance"
                            class="field" placeholder="0" /></div>
                </div>
            </form>
            <button class="gold-btn w-100 mt-3" id="saveAccountBtn"><i class="bi bi-check-lg me-2"></i>Simpan
                Akun</button>
            <button class="ghost-btn w-100 mt-2" onclick="App.closeSheet('accountSheet')">Batal</button>
        </div>
    </div>

    <div class="bottom-sheet" id="deleteSheet">
        <div class="bottom-sheet-content">
            <div class="sheet-handle"></div>
            <div class="delete-icon"><i class="bi bi-trash3-fill"></i></div>
            <div class="sheet-title" style="text-align:center">Hapus Data?</div>
            <p style="font-size:13px;color:var(--text2);text-align:center;margin-bottom:20px">Tindakan ini tidak dapat
                dibatalkan.</p>
            <button class="danger-btn w-100" id="confirmDeleteBtn">Ya, Hapus</button>
            <button class="ghost-btn w-100 mt-2" onclick="App.closeSheet('deleteSheet')">Batal</button>
        </div>
    </div>

    <div class="bottom-sheet" id="monthPickerSheet">
        <div class="bottom-sheet-content">
            <div class="sheet-handle"></div>
            <div class="sheet-title"><i class="bi bi-calendar3 me-2"></i>Pilih Periode Bulan</div>
            <div id="monthPickerGrid"
                style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px"></div>
            <button class="ghost-btn w-100" onclick="App.closeSheet('monthPickerSheet')"><i
                    class="bi bi-x-lg me-2"></i>Tutup</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-wrap">
        <div class="toast-msg" id="toastMsg"></div>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen"
        style="position:fixed;inset:0;background:#090d16;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:20px">
        <div
            style="width:44px;height:44px;border:3.5px solid rgba(245,200,66,.25);border-top-color:#F5C842;border-radius:50%;animation:ldspin .7s linear infinite">
        </div>
        <div style="font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#475569">Trading
            Suite</div>
        <style>
            @keyframes ldspin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </div>

    <script src="app.js"></script>
</body>

</html>
